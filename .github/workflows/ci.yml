name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check public repository safety
        run: bash scripts/publication-safety-check.sh
      - run: ruby -c Formula/logister.rb
      - run: brew style Formula/logister.rb
      - name: Test formula updater
        run: node --test scripts/update-formula.test.mjs
      - name: Verify package checksum
        run: |
          url="$(ruby -ne 'puts $1 if /^\s*url\s+"([^"]+)"/' Formula/logister.rb)"
          sha256="$(ruby -ne 'puts $1 if /^\s*sha256\s+"([a-f0-9]+)"/' Formula/logister.rb)"
          canonical='^https://registry\.npmjs\.org/logister-cli/-/logister-cli-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?\.tgz$'
          if ! printf '%s\n' "$url" | grep -Eq "$canonical"; then
            echo "Formula url is not the canonical logister-cli npm tarball: $url" >&2
            exit 1
          fi
          if ! printf '%s\n' "$sha256" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "Formula sha256 is not 64 lowercase hex characters: $sha256" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location "$url" --output package.tgz
          echo "$sha256  package.tgz" | shasum -a 256 --check
      - name: Install and test formula
        run: |
          brew tap taimoorq/logister "$GITHUB_WORKSPACE"
          brew install --formula taimoorq/logister/logister
          brew test taimoorq/logister/logister
          expected="$(ruby -ne 'puts $1 if %r{logister-cli-([0-9][^/]*)\.tgz}' Formula/logister.rb)"
          actual="$(logister version | awk '/^version[[:space:]]/ {print $2}')"
          test "$actual" = "$expected"
